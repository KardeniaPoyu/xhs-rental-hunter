[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "xhs-rental-hunter"
version = "1.1.0"
description = "Local rental comparison with quoted evidence, budget filtering and review questions."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.11"
authors = [
    { name = "KardeniaPoyu" }
]
dependencies = []

[project.optional-dependencies]
browser = ["pillow>=10.0.0", "websockets>=14.0,<17"]
legacy = ["pillow>=10.0.0", "websockets>=14.0,<17", "requests>=2.28.0", "python-socks>=2.8.1"]
dev = [
    "ruff>=0.9.0",
    "pytest>=8.0",
    "pillow>=10.0.0",
    "websockets>=14.0,<17",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # pyflakes
    "I",    # isort
    "N",    # pep8-naming
    "UP",   # pyupgrade
    "B",    # flake8-bugbear
    "SIM",  # flake8-simplify
    "RUF",  # ruff-specific rules
]
ignore = [
    "E402",   # module-level imports not at top
    "RUF001", # ambiguous unicode characters (Chinese punctuation is intentional)
    "RUF002", # ambiguous unicode in docstrings
    "RUF003", # ambiguous unicode in comments
]

[tool.ruff.lint.isort]
known-first-party = ["xhs"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[project.scripts]
rental-hunter = "rental_hunter.cli:main"

[tool.setuptools.packages.find]
include = ["rental_hunter*"]
